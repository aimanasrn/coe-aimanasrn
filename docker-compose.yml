services:
  postgres:
    image: postgres:17-alpine
    profiles: ["core"]
    mem_limit: 512m
    environment:
      POSTGRES_DB: studymart
      POSTGRES_USER: studymart
      POSTGRES_PASSWORD: local_training_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymart -d studymart"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: